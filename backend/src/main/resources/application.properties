spring.datasource.url=jdbc:mysql://localhost:3306/personal_finance_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
