# File này giúp backend đọc config từ biến môi trường Docker
# khi chạy bằng docker compose (override application.properties)

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/personal_finance_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080
firebase.config.path=firebase-service-account.json

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

logging.file.name=logs/finance-backend.log
logging.level.com.example.financebackend=INFO
